services:
  mysql:
    image: mysql:8.4
    container_name: kindledger-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kindledger
      MYSQL_USER: kindledger
      MYSQL_PASSWORD: kindledger
    ports:
      - "3306:3306"
    volumes:
      - kindledger_mysql:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  kindledger_mysql:
